name: Check PR Branch Direction

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

concurrency:
  group: check-pr-direction-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-pr-direction:
    name: actions/check-pr-direction-to-${{ github.base_ref }}
    runs-on: ubuntu-latest

    steps:
      - name: Get current PR info
        id: get-pr-info
        uses: actions/github-script@v8
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              headers: {
                "X-GitHub-Api-Version": "2026-03-10"
              }
            });
            core.setOutput('base', pr.data.base.ref);
            core.setOutput('head', pr.data.head.ref);

      - name: Validate PR source and target branches
        run: |
          # 厳格モード: エラー時は即終了
          set -euo pipefail
          trap 'echo "❌ Error in Validate PR source and target branches step (line $LINENO)."; exit 1' ERR

          BASE="${{ steps.get-pr-info.outputs.base }}"
          HEAD="${{ steps.get-pr-info.outputs.head }}"

          echo "Base branch (target): $BASE"
          echo "Head branch (source): $HEAD"

          # ✅ 許可されている PR の方向：dev → qa
          if [[ "$HEAD" == "dev" && "$BASE" == "qa" ]]; then
            echo "✅ Allowed PR: dev → qa"
            exit 0
          fi

          # ✅ 許可されている PR の方向：qa → main
          if [[ "$HEAD" == "qa" && "$BASE" == "main" ]]; then
            echo "✅ Allowed PR: qa → main"
            exit 0
          fi

          # ✅ 許可されている PR の方向：
          #    feature ブランチ（dev / qa / main 以外）→ dev
          if [[ "$BASE" == "dev" && "$HEAD" != "dev" && "$HEAD" != "qa" && "$HEAD" != "main" ]]; then
            echo "✅ Allowed PR: ${HEAD} → dev (feature branch → dev)"
            exit 0
          fi

          # ❌ 許可されていない PR の方向（エラー表示）
          echo "::error::Invalid PR direction: ${HEAD} → ${BASE}. Allowed directions are dev → qa, qa → main, or feature branches (not dev/qa/main) → dev."
          exit 1
